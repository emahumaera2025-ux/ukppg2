/* =========================================================
   APLIKASI UJIAN
   ========================================================= */
const TOTAL_TIME = 120 * 60;
let currentIndex = 0;
let timerSeconds = TOTAL_TIME;
let timerId = null;
let submitted = false;
const answers = {};
const marked = new Set();

const $ = sel => document.querySelector(sel);
const qid = q => q.s + q.n;

function typeLabel(q){
  if(q.t==='pg') return 'Pilihan Ganda';
  if(q.t==='kat') return 'PGK Kategori';
  if(q.t==='mcma') return `PGK MCMA — pilih ${q.pick}`;
  return '';
}

function getAnswer(q){ return answers[qid(q)]; }

function setAnswer(q, val){
  answers[qid(q)] = val;
  renderSidebar();
}

function isAnswered(q){
  const a = answers[qid(q)];
  if(q.t==='pg') return !!a;
  if(q.t==='mcma') return Array.isArray(a) && a.length > 0;
  if(q.t==='kat') {
    return Array.isArray(a) && a.length === q.st.length && a.every(v => v === 0 || v === 1);
  }
  return false;
}

function scoreQuestion(q){
  const a = answers[qid(q)];
  if(q.t==='pg'){
    const correct = a === q.k;
    return {score: correct ? 1 : 0, max:1, correct};
  }
  if(q.t==='kat'){
    let correctCount = 0;
    const arr = Array.isArray(a) ? a : [];
    q.k.forEach((k,i)=>{ if(arr[i] === k) correctCount++; });
    return {score: correctCount, max:q.k.length, correct: correctCount === q.k.length};
  }
  if(q.t==='mcma'){
    const arr = Array.isArray(a) ? a : [];
    const exact = arr.length === q.k.length && q.k.every(k => arr.includes(k));
    return {score: exact ? 1 : 0, max:1, correct: exact};
  }
  return {score:0,max:1,correct:false};
}

function formatUser(q){
  const a = answers[qid(q)];
  if(q.t==='pg') return a || '—';
  if(q.t==='mcma') return Array.isArray(a) && a.length ? a.join(', ') : '—';
  if(q.t==='kat'){
    if(!Array.isArray(a)) return '—';
    return a.map((v,i)=> v === null || v === undefined ? `${i+1}. —` : `${i+1}. ${q.labels[v]}`).join(' | ');
  }
  return '—';
}

function formatKey(q){
  if(q.t==='pg') return q.k;
  if(q.t==='mcma') return q.k.join(', ');
  if(q.t==='kat') return q.k.map((v,i)=> `${i+1}. ${q.labels[v]}`).join(' | ');
  return '';
}

function renderSidebar(){
  const sidebar = $('#sidebar');
  const sectionA = DATA.filter(q=>q.s==='I');
  const sectionB = DATA.filter(q=>q.s==='II');
  const currentId = qid(DATA[currentIndex]);

  const btn = q => {
    const id = qid(q);
    const cls = ['qbtn'];
    if(isAnswered(q)) cls.push('answered');
    if(marked.has(id)) cls.push('marked');
    if(id === currentId) cls.push('current');
    return `<button class="${cls.join(' ')}" data-id="${id}" title="${q.title}">${q.n}</button>`;
  };

  sidebar.innerHTML = `
    <div class="side-title">Navigasi Soal</div>
    <div class="section-block">
      <h3>Bagian I — Pedagogi Umum</h3>
      <div class="grid">${sectionA.map(btn).join('')}</div>
    </div>
    <div class="section-block">
      <h3>Bagian II — PCK Informatika</h3>
      <div class="grid">${sectionB.map(btn).join('')}</div>
    </div>
    <div class="side-footer">
      <div class="progress"><div class="bar" id="progressBar"></div></div>
      <div id="progressText"></div>
      <button class="danger" id="submitBtn">Selesai & Kirim Jawaban</button>
    </div>
  `;

  sidebar.querySelectorAll('.qbtn').forEach(b=>{
    b.addEventListener('click', ()=>{
      const idx = DATA.findIndex(q=>qid(q)===b.dataset.id);
      if(idx>=0){ currentIndex = idx; renderQuestion(); renderSidebar(); }
    });
  });
  $('#submitBtn').addEventListener('click', ()=>submitExam(false));
  updateProgress();
}

function updateProgress(){
  const answered = DATA.filter(isAnswered).length;
  const total = DATA.length;
  const pct = total ? Math.round(answered/total*100) : 0;
  const bar = $('#progressBar');
  const txt = $('#progressText');
  if(bar) bar.style.width = pct + '%';
  if(txt) txt.innerHTML = `<span>${answered}/${total} terjawab</span><span>${pct}%</span>`;
}

function renderQuestion(){
  if(submitted) return;
  const q = DATA[currentIndex];
  if(!q){
    console.error('Soal tidak ditemukan pada indeks', currentIndex);
    return;
  }
  $('#sectionBadge').textContent = q.s === 'I' ? 'Bagian I — Pedagogi Umum' : 'Bagian II — PCK Informatika';
  $('#typeBadge').textContent = typeLabel(q);
  $('#qTitle').textContent = `${q.title} — ${typeLabel(q)}`;
  
  // Render text dan tag <pre> tanpa escape (karena data hardcoded dan aman)
  $('#qText').innerHTML = q.q;

  let html = '';
  if(q.note) html += `<div class="note">${q.note}</div>`;

  if(q.t==='pg'){
    html += `<div class="options">`;
    q.o.forEach((opt,i)=>{
      const letter = String.fromCharCode(65+i);
      const checked = getAnswer(q) === letter ? 'checked' : '';
      html += `<label class="option">
        <input type="radio" name="pg-${qid(q)}" value="${letter}" ${checked}>
        <span>${opt}</span>
      </label>`;
    });
    html += `</div>`;
  } else if(q.t==='mcma'){
    const arr = getAnswer(q) || [];
    html += `<div class="hint">Pilih ${q.pick} jawaban yang benar.</div><div class="options">`;
    q.o.forEach((opt,i)=>{
      const letter = String.fromCharCode(65+i);
      const checked = arr.includes(letter) ? 'checked' : '';
      const disabled = (!checked && arr.length >= q.pick) ? 'disabled' : '';
      html += `<label class="option">
        <input type="checkbox" name="mcma-${qid(q)}" value="${letter}" ${checked} ${disabled}>
        <span>${opt}</span>
      </label>`;
    });
    html += `</div>`;
  } else if(q.t==='kat'){
    const arr = getAnswer(q) || Array(q.st.length).fill(null);
    html += `<table class="kat-table"><thead><tr>
      <th>No</th><th>Pernyataan</th><th>${q.labels[0]}</th><th>${q.labels[1]}</th>
    </tr></thead><tbody>`;
    q.st.forEach((st,i)=>{
      const v = arr[i];
      html += `<tr>
        <td>${i+1}</td>
        <td>${st}</td>
        <td><input type="radio" name="kat-${qid(q)}-${i}" value="0" ${v===0?'checked':''}></td>
        <td><input type="radio" name="kat-${qid(q)}-${i}" value="1" ${v===1?'checked':''}></td>
      </tr>`;
    });
    html += `</tbody></table>`;
  }

  $('#qBody').innerHTML = html;
  $('#markBtn').textContent = marked.has(qid(q)) ? 'Hapus Ragu-ragu' : 'Ragu-ragu';

  if(q.t==='pg'){
    document.querySelectorAll(`input[name="pg-${qid(q)}"]`).forEach(inp=>{
      inp.addEventListener('change', e=>{
        setAnswer(q, e.target.value);
      });
    });
  } else if(q.t==='mcma'){
    document.querySelectorAll(`input[name="mcma-${qid(q)}"]`).forEach(inp=>{
      inp.addEventListener('change', e=>{
        let arr = getAnswer(q) || [];
        if(e.target.checked){
          if(arr.length >= q.pick){
            e.target.checked = false;
            alert(`Pilih maksimal ${q.pick} jawaban.`);
            return;
          }
          arr = [...arr, e.target.value];
        } else {
          arr = arr.filter(x=>x !== e.target.value);
        }
        setAnswer(q, arr);
        document.querySelectorAll(`input[name="mcma-${qid(q)}"]`).forEach(x=>{
          x.disabled = !x.checked && arr.length >= q.pick;
        });
      });
    });
  } else if(q.t==='kat'){
    document.querySelectorAll(`input[type="radio"][name^="kat-${qid(q)}-"]`).forEach(inp=>{
      inp.addEventListener('change', e=>{
        const idx = Number(e.target.name.split('-').pop());
        let arr = getAnswer(q) || Array(q.st.length).fill(null);
        arr = arr.slice();
        arr[idx] = Number(e.target.value);
        setAnswer(q, arr);
      });
    });
  }
}

function startTimer(){
  updateTimer();
  timerId = setInterval(()=>{
    timerSeconds--;
    updateTimer();
    if(timerSeconds <= 0){
      clearInterval(timerId);
      alert('Waktu habis. Jawaban dikirim otomatis.');
      submitExam(true);
    }
  }, 1000);
}

function updateTimer(){
  const h = Math.floor(timerSeconds/3600);
  const m = Math.floor((timerSeconds%3600)/60);
  const s = timerSeconds%60;
  const el = $('#timer');
  el.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  if(timerSeconds <= 300) el.classList.add('danger');
}

function calculateResult(){
  let score = 0, max = 0;
  const sections = {I:{score:0,max:0}, II:{score:0,max:0}};
  const details = [];
  DATA.forEach(q=>{
    const res = scoreQuestion(q);
    score += res.score;
    max += res.max;
    sections[q.s].score += res.score;
    sections[q.s].max += res.max;
    details.push({
      q, ...res,
      user: formatUser(q),
      key: formatKey(q)
    });
  });
  return {score, max, percent: max ? (score/max*100) : 0, sections, details};
}

function submitExam(auto){
  if(submitted) return;
  if(!auto){
    const answered = DATA.filter(isAnswered).length;
    const belum = DATA.length - answered;
    if(!confirm(`Yakin ingin mengirim jawaban? ${belum} soal belum terjawab lengkap. Setelah dikirim, jawaban tidak dapat diubah.`)){
      return;
    }
  }
  submitted = true;
  clearInterval(timerId);
  renderResult();
}

function renderResult(){
  const result = calculateResult();
  const examView = $('#examView');
  const resultView = $('#resultView');
  examView.style.display = 'none';
  resultView.style.display = 'block';

  const detailRows = result.details.map(d=>{
    const q = d.q;
    return `<tr>
      <td>${q.s}${q.n}</td>
      <td>${q.title}</td>
      <td>${typeLabel(q)}</td>
      <td>${d.correct ? '<span class="ok-text">Benar</span>' : '<span class="bad-text">Belum tepat</span>'}</td>
      <td>${d.user}</td>
      <td>${d.key}</td>
    </tr>`;
  }).join('');

  resultView.innerHTML = `
    <div class="result-wrap">
      <div>
        <h2 style="margin:0 0 6px">Hasil Simulasi UKPPPG Informatika 2026</h2>
        <div style="color:var(--muted);font-size:13px">Penilaian otomatis berdasarkan kunci pada dokumen latihan.</div>
      </div>

      <div class="score-grid">
        <div class="score-card">
          <div class="label">Skor Total</div>
          <div class="value">${result.score.toFixed(0)}<span style="font-size:14px;color:var(--muted)">/${result.max}</span></div>
          <div class="small">${result.percent.toFixed(1)}%</div>
        </div>
        <div class="score-card">
          <div class="label">Bagian I — PU</div>
          <div class="value">${result.sections.I.score}<span style="font-size:14px;color:var(--muted)">/${result.sections.I.max}</span></div>
          <div class="small">Pedagogi Umum</div>
        </div>
        <div class="score-card">
          <div class="label">Bagian II — PCK</div>
          <div class="value">${result.sections.II.score}<span style="font-size:14px;color:var(--muted)">/${result.sections.II.max}</span></div>
          <div class="small">PCK Informatika</div>
        </div>
        <div class="score-card">
          <div class="label">Status</div>
          <div class="value" style="font-size:18px">${result.percent >= 70 ? 'Baik' : 'Perlu Latihan'}</div>
          <div class="small">Ambang latihan: 70%</div>
        </div>
      </div>

      <div class="result-actions">
        <button class="primary" onclick="location.reload()">Ulangi Ujian</button>
        <button onclick="window.print()">Cetak / Simpan PDF</button>
      </div>

      <div style="overflow:auto;max-height:60vh;border:1px solid var(--line);border-radius:14px">
        <table class="result-table">
          <thead><tr>
            <th>No</th><th>Soal</th><th>Bentuk</th><th>Status</th><th>Jawaban Anda</th><th>Kunci</th>
          </tr></thead>
          <tbody>${detailRows}</tbody>
        </table>
      </div>

      <div style="font-size:12px;color:var(--muted);line-height:1.5">
        Catatan: PGK Kategori dinilai per pernyataan. PGK MCMA dinilai benar jika seluruh pilihan tepat sesuai kunci.
      </div>
    </div>
  `;
}

$('#prevBtn').addEventListener('click', ()=>{
  if(currentIndex > 0){ currentIndex--; renderQuestion(); renderSidebar(); }
});
$('#nextBtn').addEventListener('click', ()=>{
  if(currentIndex < DATA.length - 1){ currentIndex++; renderQuestion(); renderSidebar(); }
});
$('#markBtn').addEventListener('click', ()=>{
  const id = qid(DATA[currentIndex]);
  if(marked.has(id)) marked.delete(id); else marked.add(id);
  renderSidebar();
  $('#markBtn').textContent = marked.has(id) ? 'Hapus Ragu-ragu' : 'Ragu-ragu';
});
$('#clearBtn').addEventListener('click', ()=>{
  const q = DATA[currentIndex];
  delete answers[qid(q)];
  renderQuestion();
  renderSidebar();
});

renderSidebar();
renderQuestion();
startTimer();
</script>
</body>
</html>
